<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSV Infocom | A 3D Synergy</title>
<meta name="description" content="Download from JSV Infocom.">
<link rel="icon" href="logo2.png">
<style>
  :root {
    --bg: #ffffff;
    --text: #2f3338;
    --muted: #666d76;
    --green: #7ab51d;
    --green-dark: #5f9014;
    --line: #e6e8eb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    text-align: center;
  }
  main { max-width: 32rem; width: 100%; }
  .company-logo {
    width: min(75vw, 300px);
    height: auto;
    display: block;
    margin: 0 auto 2rem;
  }
  .app-icon {
    width: 128px;
    height: 128px;
    display: block;
    margin: 0 auto 1.5rem;
    border-radius: 28px;
    box-shadow: 0 6px 18px rgba(31, 94, 255, 0.18);
  }
  h1 {
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin: 0 0 0.75rem;
  }
  p { color: var(--muted); font-size: 1.1rem; margin: 0 0 2rem; }
  .btn {
    display: inline-block;
    background: var(--green);
    color: #1d2410;
    text-decoration: none;
    font-weight: 700;
    font-size: 1.05rem;
    padding: 0.9rem 2.4rem;
    border-radius: 999px;
    transition: background 0.15s ease;
  }
  .btn:hover { background: var(--green-dark); color: #fff; }
  .btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  .note { font-size: 0.9rem; margin: 1rem 0 0; }
  footer {
    margin-top: 3rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--line);
    font-size: 0.85rem;
    color: var(--muted);
    width: min(100%, 32rem);
  }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
  <main>
    <img class="company-logo" src="logo.png" alt="JSV Infocom - A 3D Synergy">
    <img class="app-icon" src="logo2.png" alt="App icon">
    <h1>Download Your Support Assistent</h1>
    <p>Get the latest version of the app.</p>

    <!-- Replace the link below with your real download URL -->
    <a class="btn" href="https://github.com/USERNAME/REPO/releases/latest/download/app.apk">Download</a>
    <p class="note">HelpLink</p>
  </main>

  <footer>&copy; 2026 JSV Infocom</footer>
</body>
</html>
